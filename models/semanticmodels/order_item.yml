semantic_models:
  - name: order_items
    description: |
      Items contained in each order. The grain is one row per order item.
    model: ref('order_items')
    defaults:
      agg_time_dimension: ordered_at

    measures:
      - name: revenue
        description: Revenue per order item
        agg: sum
        expr: product_price

      - name: food_revenue
        agg: sum
        expr: case when is_food_item then product_price else 0 end

      - name: drink_revenue
        agg: sum
        expr: case when is_drink_item then product_price else 0 end

      - name: order_cost
        agg: sum
        expr: supply_cost

      - name: median_revenue
        agg: median
        expr: product_price

